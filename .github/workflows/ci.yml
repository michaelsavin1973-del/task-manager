name: Task Manager CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint code (flake8)
        working-directory: backend
        run: |
          flake8 app

      - name: Run basic tests
        working-directory: backend
        run: |
          pytest -q

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t task-manager-backend:${{ github.sha }} ./backend

      - name: Start container
        run: docker run -d --name task-manager-ci -p 5000:5000 -e DATABASE_URL=sqlite:////tmp/task-manager.db task-manager-backend:${{ github.sha }}

      - name: Check container health
        run: |
          for attempt in {1..10}; do
            if curl --fail --silent --max-time 2 http://localhost:5000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs task-manager-ci
          exit 1

      - name: Remove test container
        if: always()
        run: docker rm -f task-manager-ci || true

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag task-manager-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/task-manager-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/task-manager-backend:${{ github.sha }}
